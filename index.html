<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Žibintėlio kelionė</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#3d3029;background:#f8f0dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#fff8e8,#f0dfbb)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #186b86;outline-offset:3px}.shell{max-width:950px;margin:auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;color:#64462d;font-size:clamp(18px,3vw,25px)}.tiny{font-size:14px;color:#675342}.tools{display:flex;gap:8px}.tool{border:2px solid #d8b884;background:#fff8e9;border-radius:15px;padding:10px 13px;font-weight:750}.panel{margin-top:12px;background:#fffaf0;border:2px solid #e2cba2;border-radius:27px;box-shadow:0 12px 35px #6d4c2420;padding:clamp(15px,3vw,26px);flex:1}.progress{display:flex;justify-content:center;gap:10px;margin:4px auto 15px}.dot{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#eadcc3;border:2px solid #d4bc91;font-size:17px}.dot.on{background:#ffe6a2;box-shadow:0 0 12px #ffc74c}.scene{position:relative;overflow:hidden;min-height:250px;border-radius:22px;background:linear-gradient(#b5d4ce,#f5dcaa 66%,#c8b98c 66%,#c5a67c);border:2px solid #d4c39d;display:flex;align-items:center;justify-content:center;gap:22px;padding:20px}.scene:before,.scene:after{content:'🍁';position:absolute;font-size:42px;opacity:.6;top:12px;left:20px}.scene:after{content:'🍂';left:auto;right:20px;top:35px}.night{background:linear-gradient(#344a66,#6f7990 65%,#88735c 65%,#9c8465)}.lantern{font-size:clamp(75px,16vw,140px);filter:drop-shadow(0 0 18px #ffe18c);animation:bob 3s ease-in-out infinite;line-height:1.2}.face{font-size:clamp(55px,10vw,100px)}@keyframes bob{50%{transform:translateY(-8px)}}h1{font-size:clamp(26px,5vw,40px);margin:12px 0 7px;text-align:center}h2{font-size:clamp(23px,4vw,32px);margin:10px 0;text-align:center}.prompt{text-align:center;font-size:clamp(21px,3.6vw,29px);font-weight:800;margin:14px 0 18px}.narration{text-align:center;font-size:clamp(16px,2.5vw,19px);line-height:1.5;margin:12px auto;max-width:670px}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:18px auto}.big{border:3px solid #cba361;border-radius:19px;background:#fff4d7;min-height:78px;min-width:125px;padding:12px 20px;font-weight:800;font-size:clamp(18px,3vw,24px);box-shadow:0 5px 0 #d9bd87;transition:transform .1s}.big:active,.item:active{transform:scale(.96)}.big.primary{background:#ffdb80;border-color:#c79235}.big:disabled{opacity:.55;cursor:not-allowed}.item{border:3px solid #d6b782;background:#fff9ec;border-radius:22px;min-width:100px;min-height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:12px;box-shadow:0 5px 0 #e0cda9;font-size:clamp(42px,7vw,68px)}.item span{font-size:17px;font-weight:800}.item.unlit{filter:grayscale(1);background:#f0ede8}.item.found{background:#f9e5a6;border-color:#d79d2e}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:560px;margin:14px auto}.grid .item{min-width:0}.feedback{min-height:58px;text-align:center;font-size:20px;font-weight:750;color:#456440;margin:12px auto;max-width:650px}.feedback.try{color:#8c5b26}.footer{font-size:13px;text-align:center;color:#75644c;margin:14px 0}.hint{background:#f4edcf;border:2px solid #e1cc87;padding:12px 16px;border-radius:15px;text-align:center;font-size:18px;max-width:640px;margin:12px auto}.choice{display:flex;flex-direction:column;align-items:center;gap:8px}.choice .item{width:100%;max-width:350px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:660px;margin:15px auto}.two .item{width:100%;min-width:0;min-height:170px}.two .item span{font-size:18px}.flowers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.vase{font-size:95px;text-align:center;background:#e8f0df;border:3px dashed #8baf83;border-radius:20px;max-width:260px;margin:10px auto;padding:5px}.muted{opacity:.35}.vase-wrap{position:relative;width:230px;height:220px;margin:12px auto 4px;display:flex;justify-content:center;align-items:flex-end}.vase-body{position:absolute;bottom:0;width:142px;height:115px;background:linear-gradient(100deg,#b77c50,#e9b889 45%,#a76548);border:5px solid #96634a;border-radius:20px 20px 48px 48px;box-shadow:inset 12px 0 #ffffff30}.vase-body:before{content:'';position:absolute;top:-12px;left:-12px;width:156px;height:19px;border-radius:50%;background:#e7b98c;border:5px solid #96634a}.bouquet{position:absolute;z-index:2;top:5px;left:0;right:0;display:flex;justify-content:center;gap:0;align-items:flex-end;height:130px}.bouquet-flower{display:inline-flex;flex-direction:column;align-items:center;font-size:59px;line-height:.9;margin:0 -7px}.bouquet-flower small{font-size:32px;line-height:1}.candle{position:relative;display:block;width:54px;height:83px;margin:3px auto}.candle .wax{position:absolute;bottom:0;left:11px;width:33px;height:58px;border-radius:7px 7px 5px 5px;background:linear-gradient(90deg,#e8d0b5,#fff4e2 40%,#ddbd9d);border:2px solid #c8a88b}.candle .wick{position:absolute;bottom:56px;left:27px;width:3px;height:10px;background:#54453c}.candle .flame{position:absolute;bottom:66px;left:19px;width:18px;height:27px;border-radius:80% 0 70% 70%;transform:rotate(-45deg);background:linear-gradient(135deg,#fff7a0,#ffad29 65%,#f17b16);box-shadow:0 0 16px #ffc857}.candle.dark .flame{display:none}.candle.dark .wax{background:linear-gradient(90deg,#b7b1ad,#f1eae3 45%,#bdb4ab)}.mini{background:#f7efd9;border:2px solid #dfc18b;border-radius:20px;padding:12px;margin:16px auto;max-width:720px}.mini .big{min-width:130px;min-height:64px;font-size:18px}.reset-confirm{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,460px);padding:24px;background:#fffaf0;border:4px solid #bc8a44;border-radius:22px;box-shadow:0 0 0 100vmax #2d211b88,0 12px 40px #3335;text-align:center;font-size:23px}.reset-confirm .actions{margin-bottom:0}.status{font-weight:800;text-align:center;color:#775a32}.restart{color:#755438}.spark{font-size:30px;animation:bob 2s infinite}@media(max-width:480px){.shell{padding:8px}.panel{border-radius:18px;padding:12px}.scene{min-height:190px}.top{flex-wrap:wrap}.grid{gap:6px}.item{padding:8px;min-height:85px}.two .item{min-height:145px}.tool{padding:8px}.big{min-height:64px}}
</style></head><body><main class="shell"><header class="top"><div><div class="brand">🏮 Žibintėlio kelionė</div><div class="tiny">Šilta rudens pasaka • 4–6 metų vaikams</div></div><div class="tools"><button id="restart" class="tool restart" title="Pradėti iš naujo">↻ Iš naujo</button></div></header><section class="panel" id="app" aria-live="polite"></section><div class="footer">Žaisk savo tempu. Gali bandyti tiek kartų, kiek reikia. 🍁 <a href="https://korsigita.com/privatumo-politika/" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-left:10px;color:#64462d;text-decoration:underline;text-underline-offset:3px;">Privatumo politika</a></div></main><script>
'use strict';
const app=document.getElementById('app');const SAVE='zibintelio_kelione_v1';
let state={stage:-1,step:0,found:[],pairs:[],selected:null,flowers:[],lights:[],extra:{}};try{const v=JSON.parse(localStorage.getItem(SAVE));if(v&&Number.isInteger(v.stage)&&v.stage>=-1&&v.stage<=6)state={...state,...v}}catch(e){}
state.extra=state.extra||{};let hintShown=false;let feedback='';let feedbackTry=false;let confirmReset=false;
const titles=['Surask švieseles','Padėk Ežiukui','Prisiminimų albumas','Gėlių sodas','Tylusis takas','Prisiminimų medis'];
const instructions=['Surask tris švieseles.','Surask vienodos spalvos lapus.','Parodyk senelį.','Sudėk tris gėles į vazą.','Parodyk, kaip elgsiesi kapinėse.','Uždek žvakeles.'];
const stories=['Žibintėlis pametė tris mažas švieseles. Padėk jas surasti!','Ežiukas prašo padėti surasti vienodus lapus.','Žibintėlis rado seną šeimos albumą.','Vėjas išbarstė gėles. Padėk jas surinkti.','Žmonės čia ramiai prisimena mirusius artimuosius.','Žibintėlis pasiekė prisiminimų medį. Padėk jam sužibėti!'];
function persist(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}
function progress(){return '<div class="progress" aria-label="Kelionės pažanga">'+titles.map((t,i)=>`<div class="dot ${i<state.stage?'on':''}" title="${t}">${i<state.stage?'✨':'○'}</div>`).join('')+'</div>'}
function button(txt,action,extra=''){return `<button class="big ${extra}" data-act="${action}">${txt}</button>`}
function header(emoji){return `${progress()}<div class="scene ${state.stage>=4?'night':''}"><span class="lantern">🏮</span><span class="face">${emoji}</span></div><h2>${state.stage+1}. ${titles[state.stage]}</h2><p class="narration">${stories[state.stage]}</p><p class="prompt">${instructions[state.stage]}</p>`}
function item(emoji,act,label='',cls=''){return `<button class="item ${cls}" data-act="${act}" aria-label="${label||emoji}">${emoji}${label?`<span>${label}</span>`:''}</button>`}
const mini=[{q:'Kuris daiktas šviečia?',a:['Lapas','Žibintas','Grybas'],ok:1,h:'Pagalvok, kas skleidžia šviesą.'},{q:'Kiek lapų yra poroje?',a:['Vienas','Du','Trys'],ok:1,h:'Pora – du vienodi daiktai.'},{q:'Ką galime saugoti albume?',a:['Nuotraukas','Lietų','Vėją'],ok:0,h:'Albume galime laikyti šeimos nuotraukas.'},{q:'Ko reikia gėlei augti?',a:['Vandens','Saldainių','Batų'],ok:0,h:'Gėlė yra augalas.'},{q:'Ką darysi pamatęs nukritusią gėlę prie kapo?',a:['Nuspirsiu','Pakelsiu','Paslėpsiu'],ok:1,h:'Pagalvok, kaip pasirūpinti aplinka.'},{q:'Kiek žvakelių uždegei?',a:['6','4','2'],ok:1,h:'Suskaičiuok žvakeles, kurias uždegei pats.'}];
function render(){let html='';if(state.stage===-1){html=`<div class="scene"><span class="lantern">🏮</span><span class="face">🦉</span></div><h1>Žibintėlio kelionė</h1><p class="narration">Mažas Žibintėlis keliauja rudens taku. Padėk jam surinkti šešias gerumo švieseles!</p><div class="actions">${button('✨ Pradėti kelionę','start','primary')}</div>`}
else if(state.stage===6){html=`${progress()}<div class="scene night"><span class="face">🌳</span><span class="lantern">🏮</span><span class="spark">✨</span></div><h1>Kelionė baigta!</h1><p class="prompt">Prisimename. Gerbiame. Saugome širdyje.</p><p class="narration">Žmonės uždega žvakeles. Taip jie prisimena mirusius artimuosius.</p><div class="actions">${button('🌟 Žaisti dar kartą','playagain','primary')}</div>`}
else{html=header(['🍂','🦔','🖼️','🌼','🕯️','🌳'][state.stage]);let done=false;
if(state.stage===0){const arr=['🍂','🏮','🍄','🌿','🏮','🍁','🌰','🍂','🏮'];html+=`<div class="grid">${arr.map((x,i)=>item(state.found.includes(i)?'✨':x,'find:'+i,'Ieškok švieselės',state.found.includes(i)?'found':'' )).join('')}</div><p class="status">Surasta: ${state.found.length} iš 3</p>`;done=state.found.length===3}
if(state.stage===1){const arr=['🍁','🍃','🍂','🍁','🍂','🍃'];html+=`<div class="grid">${arr.map((x,i)=>item(state.pairs.includes(i)?'✨':x,'pair:'+i,'Lapas',state.selected===i?'found':state.pairs.includes(i)?'found':'' )).join('')}</div><p class="status">Surastos poros: ${state.pairs.length/2} iš 3</p>`;done=state.pairs.length===6}
if(state.stage===2){html+=`<div class="grid">${item('👧','person:0','Mergaitė')}${item('👴','person:1','Senelis')}${item('👩','person:2','Moteris')}</div>`;done=state.step===1}
if(state.stage===3){const things=['🌷','🍃','🌼','🍂','🌸','🌿'];html+=`<div class="flowers">${things.map((x,i)=>item(state.flowers.includes(i)?'✨':x,'flower:'+i,i%2===0?'Gėlė':'Lapas',state.flowers.includes(i)?'found':'' )).join('')}</div><div class="vase-wrap" aria-label="Vaza su gėlėmis"><div class="bouquet">${state.flowers.map(i=>`<span class="bouquet-flower">${things[i]}<small>🌿</small></span>`).join('')}</div><div class="vase-body"></div></div><p class="status">Gėlės vazoje: ${state.flowers.length} iš 3</p>`;done=state.flowers.length===3}
if(state.stage===4){html+=`<div class="two">${item('🧒🤫','behave:yes','Ramiai stoviu')}${item('🧒📣','behave:no','Garsiai šūkauju')}</div>`;done=state.step===1}
if(state.stage===5){html+=`<div class="grid">${Array.from({length:6},(_,i)=>{const lit=[0,3].includes(i)||state.lights.includes(i);return item(`<span class="candle ${lit?'burning':'dark'}"><span class="flame"></span><span class="wick"></span><span class="wax"></span></span>`,'light:'+i,lit?'Deganti žvakelė':'Nedeganti žvakelė',lit?'found':'')}).join('')}</div><p class="status">Uždegta: ${state.lights.length} iš 4</p>`;done=state.lights.length===4}
if(done&&!state.extra.quizOK){const q=mini[state.stage];html+=`<div class="mini"><p class="prompt">Dar vienas klausimas!</p><p class="narration"><strong>${q.q}</strong></p><div class="actions">${q.a.map((a,i)=>button(a,'quiz:'+i)).join('')}</div></div>`}if(hintShown)html+=`<div class="hint">💡 ${['Ieškok mažų žibintų tarp rudens daiktų.','Vienodi lapai atrodo taip pat.','Senelis – vyresnio amžiaus vyras.','Ieškok gėlių žiedų. Lapus palik.','Pagalvok, kaip elgtis ramioje vietoje.','Surask žvakeles be liepsnelės.'][state.stage]}</div>`;
html+=`<div class="feedback ${feedbackTry?'try':''}">${feedback||(done?'✨ Puiku! Tu padėjai Žibintėliui!':'')}</div><div class="actions">${button('💡 Pagalba','hint')}${done&&state.extra.quizOK?button('Toliau →','next','primary'):''}</div>`}
if(confirmReset)html+=`<div class="reset-confirm" role="dialog" aria-label="Pradėti iš naujo"><strong>Pradėti kelionę iš naujo?</strong><div class="actions">${button('Taip, pradėti','resetyes','primary')}${button('Ne, tęsti','resetno')}</div></div>`;app.innerHTML=html;persist();}
function reset(){state={stage:-1,step:0,found:[],pairs:[],selected:null,flowers:[],lights:[],extra:{}};feedback='';hintShown=false;persist();render()}
function next(){state.stage++;state.step=0;state.found=[];state.pairs=[];state.selected=null;state.flowers=[];state.lights=[];state.extra={};hintShown=false;feedback='';feedbackTry=false;render()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const [act,arg]=b.dataset.act.split(':');if(act==='resetyes'){confirmReset=false;reset();return}if(act==='resetno'){confirmReset=false;render();return}if(act==='start'){state.stage=0;render();return}if(act==='next'){next();return}if(act==='playagain'){reset();return}if(act==='hint'){hintShown=!hintShown;render();return}if(act==='quiz'){if(Number(arg)===mini[state.stage].ok){state.extra.quizOK=true;feedback='Teisingai! Keliauk toliau.';feedbackTry=false}else{feedback='Pagalvok ir bandyk dar kartą.';feedbackTry=true}render();return}
feedback='';feedbackTry=false;const i=Number(arg);
if(act==='find'){if([1,4,8].includes(i)&&!state.found.includes(i)){state.found.push(i);feedback='Šaunu! Radome švieselę.'}else if(![1,4,8].includes(i)){feedback='Paieškok dar. Kur slepiasi žibintėlis?';feedbackTry=true}}
if(act==='pair'){if(state.pairs.includes(i))return;if(state.selected===null){state.selected=i;feedback='Dabar surask tokį pat lapą.'}else if(state.selected===i){state.selected=null;feedback='Pasirink kitą lapą.'}else{const arr=['a','b','c','a','c','b'];if(arr[state.selected]===arr[i]){state.pairs.push(state.selected,i);feedback='Puiku! Lapai vienodi.'}else{feedback='Lapai skiriasi. Bandyk dar kartą.';feedbackTry=true}state.selected=null}}
if(act==='person'){if(i===1){state.step=1;feedback='Taip! Tai senelis. Nuotraukos padeda prisiminti.'}else{feedback='Pažiūrėk dar kartą. Kur senelis?';feedbackTry=true}}
if(act==='flower'){if(i%2===0&&!state.flowers.includes(i)){state.flowers.push(i);feedback='Ačiū! Gėlė jau vazoje.'}else if(i%2!==0){feedback='Tai lapas. Ieškok gėlės žiedo.';feedbackTry=true}}
if(act==='behave'){if(arg==='yes'){state.step=1;feedback='Teisingai. Čia elgiamės ramiai ir pagarbiai.'}else{feedback='Čia žmonės prisimena artimuosius. Kaip galime juos gerbti?';feedbackTry=true}}
if(act==='light'&&![0,3].includes(i)&&!state.lights.includes(i)){state.lights.push(i);feedback='Žvakelė sužibo!'}else if(act==='light'&&[0,3].includes(i)){feedback='Ši žvakelė jau dega. Ieškok nedegančios.';feedbackTry=true}
render()
});
document.getElementById('restart').addEventListener('click',()=>{confirmReset=!confirmReset;render()});render();
</script>
